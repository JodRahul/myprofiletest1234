
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Bar</title>

    <style>
        * {
            text-decoration: none;
        }

        /* Navigation bar */
        .navbar {
            height: 50px;
            background-color: #0f1111;
            
        }
  
        /* Boxes */
        .box {
            height: 200px;
        
            border: 2px solid black;
        }

        /* Footer */
        footer {
            background-color: #0f1111;
            color: white;
            text-align: center;
            padding: 10px;
        }
      
    </style>
</head>

<body>

    <header>
        <div class="navbar">

            <a href="https://www.amazon.in"
                style="color: #f08804; margin-right: 200px; font-size: 20px;">
                amazon.in
            </a>

            <a href="https://www.amazon.in/gp/help/customer/display.html?nodeId=GKM69DUUYKQWKWX7"
                style="color: white; margin-right: 200px; font-size: 20px;">
                Account
            </a>

            <a href="https://www.amazon.in/gp/help/customer/display.html?nodeId=GKM69DUUYKQWKWX7"
                style="color: white; margin-right: 200px; font-size: 20px;">
                Orders
            </a>

            <a href="https://www.amazon.in/gp/help/customer/display.html?nodeId=GKM69DUUYKQWKWX7"
                style="color: white; margin-right: 200px; font-size: 20px;">
                Contact Us
            </a>

            <input type="text" placeholder="Search"
                style="height: 30px; width: 200px;">

            <button
                style="background-color: #f08804; color: white; height: 30px; width: 100px;">
                Search
            </button>

        </div>
    </header>


    <!-- Content -->
    <div class="contentbox">

        <div class="box"
            style="background-color: rgba(29, 221, 167, 0.5);">
            box 1
        </div>

        <div class="box"
            style="background-color: rgba(211, 14, 233, 0.5);">
            box 2
        </div>

        <div class="box"
            style="background-color: rgba(152, 63, 63, 0.5);">
            box 3
        </div>

    </div>


    <!-- Footer -->
    <footer>
        &copy; 2024 Amazon.com, Inc. or its affiliates
    </footer>

</body>

</html>
